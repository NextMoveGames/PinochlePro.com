name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check homepage.js && node --check site.js
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
